<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a bela Sintra — Cardápios do Salão</title>
<meta name="theme-color" content="#1e4028">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root {
    --ouro-rgb: 201,168,76;
    --verde: #1e4028; --verde-claro: #2d6040; --verde-mais-claro: #3d7550; --ouro: #7a5c0a; --ouro-claro: #8b6814;
    --branco: #f5f0e8; --tinta-rgb: 30,64,40; --topbar-rgb: 238,245,239; --sidebar-rgb: 15,35,20;
    --bg1: #c5ddc8; --bg2: #b8d1bb; --surface: #ffffff;
    --cinza: rgba(var(--tinta-rgb),0.06); --cinza-medio: rgba(var(--tinta-rgb),0.12);
    --cinza-escuro: rgba(var(--tinta-rgb),0.82); --texto: #1a2e1e;
    --perigo: #c62828; --sucesso: #16a34a; --aviso: #b45309;

  }
  :root[data-tema="claro-direto"] {
    --ouro-rgb: 107,118,132;
    --verde: #1e3a5f; --verde-claro: #2d5a8f; --verde-mais-claro: #3f72ab; --ouro: #55606c; --ouro-claro: #6b7684;
    --tinta-rgb: 28,28,30; --topbar-rgb: 245,245,247; --sidebar-rgb: 20,24,28;
    --bg1: #eef1f4; --bg2: #e2e7ec; --surface: #ffffff; --texto: #1c1c1e;
  }
  :root[data-tema="noite-ouro"] {
    --ouro-rgb: 201,164,61;
    --verde: #0d2818; --verde-claro: #1a4a2e; --verde-mais-claro: #28603f; --ouro: #9c7a1a; --ouro-claro: #c9a43d;
    --tinta-rgb: 21,35,26; --topbar-rgb: 230,236,230; --sidebar-rgb: 8,16,10;
    --bg1: #b9c7ba; --bg2: #9fb3a3; --surface: #ffffff; --texto: #15231a;
  }
  :root[data-tema="terracota-linho"] {
    --ouro-rgb: 138,111,58;
    --verde: #8a3b1f; --verde-claro: #a8502f; --verde-mais-claro: #c06a45; --ouro: #6b5327; --ouro-claro: #8a6f3a;
    --tinta-rgb: 58,43,31; --topbar-rgb: 245,238,230; --sidebar-rgb: 38,26,18;
    --bg1: #e8dcc9; --bg2: #dcccb0; --surface: #fffaf4; --texto: #3a2b1f;
  }
  :root[data-tema="marinho-prata"] {
    --ouro-rgb: 124,135,149;
    --verde: #1d3a5f; --verde-claro: #2c5282; --verde-mais-claro: #3d6ba3; --ouro: #5a6472; --ouro-claro: #7c8795;
    --tinta-rgb: 26,39,51; --topbar-rgb: 238,242,247; --sidebar-rgb: 12,22,36;
    --bg1: #cdd9e6; --bg2: #b7c8db; --surface: #ffffff; --texto: #1a2733;
  }
  :root[data-tema="rosa-champagne"] {
    --ouro-rgb: 184,159,104;
    --verde: #7a3b4a; --verde-claro: #95505f; --verde-mais-claro: #ad6b78; --ouro: #9c8450; --ouro-claro: #b89f68;
    --tinta-rgb: 58,38,48; --topbar-rgb: 248,240,240; --sidebar-rgb: 34,20,26;
    --bg1: #ecd9dd; --bg2: #e0c4ca; --surface: #fffbf8; --texto: #3a2630;
  }
  :root[data-tema="grafite-lima"] {
    --ouro-rgb: 155,194,51;
    --verde: #2e3330; --verde-claro: #454c47; --verde-mais-claro: #5c6660; --ouro: #7a9c1a; --ouro-claro: #9bc233;
    --tinta-rgb: 32,36,31; --topbar-rgb: 240,242,236; --sidebar-rgb: 18,20,17;
    --bg1: #d4dbc9; --bg2: #c2cbb3; --surface: #ffffff; --texto: #20241f;
  }
  :root[data-tema="oceano-coral"] {
    --ouro-rgb: 212,122,86;
    --verde: #0e6b6b; --verde-claro: #178a8a; --verde-mais-claro: #22a6a6; --ouro: #c0603f; --ouro-claro: #d47a56;
    --tinta-rgb: 19,48,47; --topbar-rgb: 232,245,245; --sidebar-rgb: 6,30,30;
    --bg1: #bfe3e0; --bg2: #a3d2cf; --surface: #fbfffe; --texto: #13302f;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: linear-gradient(155deg,var(--bg1) 0%,var(--bg2) 100%); background-attachment: fixed; color: var(--texto); display: flex; min-height: 100vh; }
  #sidebar { width: 240px; min-height: 100vh; background: rgba(var(--sidebar-rgb),0.98); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100; box-shadow: 3px 0 24px rgba(0,0,0,0.4); border-right: 1px solid rgba(0,0,0,0.15); }
  .logo-area { padding: 20px 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.12); text-align: center; background: transparent; }
  .logo-area .emoji { font-size: 36px; }
  .logo-area h1 { font-family: 'Cormorant Garamond', serif; color: var(--ouro-claro); font-size: 17px; font-weight: 600; margin-top: 8px; line-height: 1.3; letter-spacing: 0.3px; }
  .logo-area p { color: rgba(255,255,255,0.55); font-size: 11px; margin-top: 3px; }
  nav { flex: 1; padding: 16px 0; }
  nav .nav-group-label { color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: 16px 20px 6px; }
  nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 20px; background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.75); font-size: 13.5px; text-align: left; transition: all 0.15s; border-left: 3px solid transparent; }
  nav button:hover { background: rgba(255,255,255,0.08); color: #fff; }
  nav button.active { background: rgba(var(--ouro-rgb),0.12); color: var(--ouro-claro); border-left-color: var(--ouro); }
  nav button .icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
  .sidebar-footer small { color: rgba(255,255,255,0.35); font-size: 11px; }
  #main { margin-left: 240px; flex: 1; min-height: 100vh; }
  .topbar { background: rgba(var(--topbar-rgb),0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(var(--tinta-rgb),0.12); box-shadow: 0 2px 16px rgba(var(--tinta-rgb),0.08); position: sticky; top: 0; z-index: 50; }
  .topbar h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--ouro-claro); letter-spacing: 0.3px; }
  .topbar .sub { font-size: 12px; color: rgba(var(--tinta-rgb),0.72); margin-top: 2px; }
  .topbar-actions { display: flex; gap: 10px; }
  .btn-voltar-compras { display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex: 0 0 auto; height: 38px; padding: 0 12px; margin-right: 12px; border-radius: 12px; border: 1px solid rgba(var(--tinta-rgb),0.25); background: var(--verde, #1e4028); color: #e8f2ea; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .topbar > .btn-voltar-compras + div { flex: 1; min-width: 0; }
  @media (max-width: 700px) { .btn-voltar-compras { height: 34px; padding: 0 9px; font-size: 12px; margin-right: 8px; } }

  .content { padding: 28px 32px; }
  .section { display: none; }
  .section.active { display: block; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
  .kpi-card { background: var(--surface); border: 1px solid rgba(var(--tinta-rgb),0.1); border-radius: 16px; padding: 22px 24px; box-shadow: var(--sombra); border-top: 3px solid var(--ouro); }
  .kpi-card.verde { border-top-color: #16a34a; }
  .kpi-card.perigo { border-top-color: var(--perigo); }
  .kpi-card.aviso { border-top-color: var(--aviso); }
  .kpi-card .kpi-label { font-size: 10px; color: rgba(var(--tinta-rgb),0.72); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .kpi-card .kpi-val { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--ouro-claro); margin: 6px 0 2px; letter-spacing: -0.5px; }
  .kpi-card .kpi-sub { font-size: 12px; color: rgba(var(--tinta-rgb),0.65); }
  .panel { background: var(--surface); border: 1px solid rgba(var(--tinta-rgb),0.1); border-radius: 16px; box-shadow: var(--sombra); margin-bottom: 24px; }
  .panel-header { padding: 18px 24px; border-bottom: 1px solid rgba(var(--tinta-rgb),0.08); display: flex; align-items: center; justify-content: space-between; }
  .panel-header h3 { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: var(--ouro-claro); letter-spacing: 0.2px; }
  .panel-body { padding: 20px 24px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s, filter 0.15s; box-shadow: 0 2px 0 rgba(var(--tinta-rgb),0.18), 0 1px 3px rgba(var(--tinta-rgb),0.15); }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(1px); box-shadow: 0 0 0 rgba(var(--tinta-rgb),0.18), 0 1px 1px rgba(var(--tinta-rgb),0.12); }
  .btn-primary { background: linear-gradient(135deg,var(--verde),var(--verde-claro)); color: #e8f2ea; font-weight: 700; box-shadow: 0 2px 0 rgba(var(--tinta-rgb),0.35), 0 3px 10px rgba(var(--tinta-rgb),0.3); }
  .btn-primary:hover { background: linear-gradient(135deg,var(--verde-claro),var(--verde-mais-claro)); }
  .btn-primary:active { box-shadow: 0 0 0 rgba(var(--tinta-rgb),0.35), 0 1px 4px rgba(var(--tinta-rgb),0.25); }
  .btn-ouro { background: rgba(var(--ouro-rgb),0.15); color: var(--ouro-claro); border: 1px solid rgba(var(--ouro-rgb),0.3); box-shadow: 0 2px 0 rgba(var(--ouro-rgb),0.25); }
  .btn-ouro:hover { background: rgba(var(--ouro-rgb),0.25); }
  .btn-outline { background: var(--surface); border: 1.5px solid rgba(var(--tinta-rgb),0.25); color: rgba(var(--tinta-rgb),0.9); box-shadow: 0 2px 0 rgba(var(--tinta-rgb),0.1); }
  .btn-outline:hover { border-color: var(--verde); color: var(--verde); background: rgba(var(--tinta-rgb),0.05); }
  .btn-danger { background: var(--perigo); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn-success { background: var(--sucesso); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn-aviso { background: var(--aviso); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; box-shadow: 0 1px 0 rgba(var(--tinta-rgb),0.25); }
  .btn-sm:active { transform: translateY(1px); box-shadow: 0 0 0 rgba(var(--tinta-rgb),0.2); }
  .btn:disabled, .btn[disabled] { opacity: 0.55; cursor: not-allowed; transform: none; filter: none; box-shadow: none; }
  .tema-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .tema-card { text-align: left; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1.5px solid rgba(var(--tinta-rgb),0.12); border-radius: 14px; padding: 16px 18px; cursor: pointer; font-family: inherit; box-shadow: var(--sombra); transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.15s; }
  .tema-card:hover { border-color: var(--verde); transform: translateY(-2px); box-shadow: var(--sombra-forte); }
  .tema-card:active { transform: translateY(0); }
  .tema-card.on { border-color: var(--verde); border-width: 2px; box-shadow: 0 0 0 3px rgba(var(--tinta-rgb),0.1), var(--sombra); }
  .tema-swatches { display: flex; gap: 6px; }
  .tema-sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 0 0 1px rgba(var(--tinta-rgb),0.15); }
  .tema-nome { font-weight: 700; font-size: 14.5px; color: var(--texto); }
  .tema-desc { font-size: 12px; color: rgba(var(--tinta-rgb),0.7); }
  .tema-check { font-size: 11.5px; font-weight: 700; color: var(--sucesso); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { background: rgba(var(--tinta-rgb),0.05); color: rgba(var(--tinta-rgb),0.75); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; padding: 10px 14px; text-align: left; border-bottom: 1px solid rgba(var(--tinta-rgb),0.08); }
  td { padding: 12px 14px; border-bottom: 1px solid rgba(var(--tinta-rgb),0.07); color: var(--texto); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(var(--tinta-rgb),0.04); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-pendente { background: rgba(180,83,9,0.1); color: #b45309; border: 1px solid rgba(180,83,9,0.25); }
  .badge-confirmado { background: rgba(22,163,74,0.1); color: #16a34a; border: 1px solid rgba(22,163,74,0.25); }
  .badge-cancelado { background: rgba(198,40,40,0.1); color: #c62828; border: 1px solid rgba(198,40,40,0.25); }
  .badge-concluído { background: rgba(var(--tinta-rgb),0.07); color: rgba(var(--tinta-rgb),0.75); border: 1px solid rgba(var(--tinta-rgb),0.18); }
  .badge-concluido { background: rgba(var(--tinta-rgb),0.07); color: rgba(var(--tinta-rgb),0.75); border: 1px solid rgba(var(--tinta-rgb),0.18); }
  .badge-cat { background: var(--cinza); color: var(--cinza-escuro); font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.span2 { grid-column: span 2; }
  .form-group label { font-size: 12px; font-weight: 600; color: rgba(var(--tinta-rgb),0.82); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select, .form-group textarea { padding: 9px 12px; border: 1.5px solid rgba(var(--tinta-rgb),0.18); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--texto); transition: border-color 0.15s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--verde); background: var(--surface); box-shadow: 0 0 0 3px rgba(var(--tinta-rgb),0.08); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .resumo-ev-area { width: 100%; box-sizing: border-box; padding: 14px; border: 1.5px solid rgba(var(--tinta-rgb),0.2);
    border-radius: 10px; font-size: 14.5px; line-height: 1.55; font-family: inherit; background: var(--surface); color: var(--texto); resize: vertical; }
  .resumo-ev-area:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(var(--tinta-rgb),0.08); }
  /* ===== Mão de obra do evento: quantidade e valor ajustável ===== */
  .mo-linha { display: grid; grid-template-columns: 1fr 86px 128px 170px; gap: 10px; align-items: end;
    padding: 10px 0; border-bottom: 1px solid var(--cinza); }
  .mo-linha.on { background: rgba(var(--tinta-rgb),0.03); border-radius: 8px; padding: 10px 8px; }
  .mo-nome { font-size: 14.5px; font-weight: 600; grid-column: 1; align-self: center; }
  .mo-tag { font-size: 10.5px; font-weight: 700; color: var(--aviso); background: rgba(180,83,9,0.12);
    padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .mo-campo { display: flex; flex-direction: column; gap: 3px; }
  .mo-campo span { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: rgba(var(--tinta-rgb),0.7); }
  .mo-campo input { padding: 9px 10px; border: 1.5px solid rgba(var(--tinta-rgb),0.2); border-radius: 8px;
    font-size: 15px; font-weight: 600; text-align: center; background: var(--surface); color: var(--texto); font-family: inherit; width: 100%; }
  .mo-campo input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(var(--tinta-rgb),0.08); }
  .mo-campo input.ajustado { border-color: var(--aviso); background: #fffaf2; color: var(--aviso); }
  .mo-sub { font-size: 13px; color: var(--cinza-escuro); align-self: center; }
  .mo-voltar { display: block; margin-top: 3px; border: none; background: none; padding: 0;
    font-size: 11.5px; font-weight: 700; color: var(--azul); cursor: pointer; font-family: inherit; }
  @media (max-width: 700px) {
    .mo-linha { grid-template-columns: 1fr 1fr; grid-template-areas: 'nome nome' 'qtd preco' 'sub sub'; gap: 8px; }
    .mo-nome { grid-area: nome; } .mo-campo:nth-of-type(1) { grid-area: qtd; } .mo-campo:nth-of-type(2) { grid-area: preco; }
    .mo-sub { grid-area: sub; }
  }
  /* ===== Busca de pratos do cardápio: letra grande e filtro na hora ===== */
  .busca-prato { background: var(--cinza); border-radius: 12px; padding: 14px; margin-bottom: 16px; min-width: 0; max-width: 100%; overflow: hidden; }
  .bp-campo { position: relative; display: flex; align-items: center; }
  .bp-lupa { position: absolute; left: 16px; font-size: 22px; pointer-events: none; opacity: 0.75; }
  .bp-campo input { width: 100%; padding: 16px 48px 16px 52px; border: 2px solid rgba(var(--tinta-rgb),0.22); border-radius: 12px;
    font-size: 18px; font-weight: 600; background: var(--surface); color: var(--texto); font-family: inherit; }
  .bp-campo input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 4px rgba(var(--tinta-rgb),0.1); }
  .bp-campo input::placeholder { font-weight: 500; font-size: 16px; }
  .bp-limpar { position: absolute; right: 8px; width: 36px; height: 36px; border: none; background: transparent;
    font-size: 18px; color: rgba(var(--tinta-rgb),0.5); cursor: pointer; border-radius: 50%; display: none; }
  .bp-limpar.on { display: block; }
  .bp-chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 0 4px; min-width: 0; max-width: 100%; }
  .bp-chips button { flex: 0 1 auto; max-width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 9px 14px; border-radius: 999px; border: 1.5px solid rgba(var(--tinta-rgb),0.2);
    background: var(--surface); color: var(--texto); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .bp-chips button.on { background: var(--verde); color: #e8f2ea; border-color: var(--verde); }
  .bp-qtd-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 2px 4px; flex-wrap: wrap; }
  .bp-qtd-linha label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(var(--tinta-rgb),0.82); }
  .bp-qtd { display: flex; align-items: center; gap: 0; }
  .bp-qtd button { width: 44px; height: 44px; border: 1.5px solid rgba(var(--tinta-rgb),0.2); background: var(--surface); font-size: 22px;
    font-weight: 700; cursor: pointer; color: var(--verde); font-family: inherit; }
  .bp-qtd button:first-child { border-radius: 10px 0 0 10px; }
  .bp-qtd button:last-child { border-radius: 0 10px 10px 0; }
  .bp-qtd input { width: 64px; height: 44px; text-align: center; font-size: 18px; font-weight: 700; border: 1.5px solid rgba(var(--tinta-rgb),0.2);
    border-left: none; border-right: none; background: var(--surface); color: var(--texto); font-family: inherit; }
  .bp-lista { max-height: 340px; overflow-y: auto; margin-top: 8px; border-radius: 10px; background: var(--surface); border: 1px solid rgba(var(--tinta-rgb),0.12); }
  .bp-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 14px; border: none;
    border-bottom: 1px solid rgba(var(--tinta-rgb),0.08); background: var(--surface); cursor: pointer; font-family: inherit; }
  .bp-item:last-child { border-bottom: none; }
  .bp-item:active { background: #eef5ef; }
  .bp-item.sel { background: #eef5ef; box-shadow: inset 4px 0 0 var(--verde); }
  .bp-item-nome { font-size: 16px; font-weight: 700; color: var(--texto); line-height: 1.3; overflow-wrap: anywhere; }

  .cim-cantos button { aspect-ratio: 1 / 1.3; border: 1.5px solid rgba(var(--tinta-rgb),0.2); border-radius: 7px; background: var(--surface); cursor: pointer; position: relative; padding: 0; }
  .cim-cantos button i { position: absolute; width: 9px; height: 9px; border-radius: 3px; background: rgba(var(--tinta-rgb),.3); }
  .cim-cantos button:nth-child(3n+1) i { left: 5px; } .cim-cantos button:nth-child(3n+2) i { left: 50%; transform: translateX(-50%); } .cim-cantos button:nth-child(3n) i { right: 5px; }
  .cim-cantos button:nth-child(-n+3) i { top: 5px; } .cim-cantos button:nth-child(n+4):nth-child(-n+6) i { top: 50%; margin-top: -4.5px; } .cim-cantos button:nth-child(n+7) i { bottom: 5px; }

  .cim-bib-item { position: relative; text-align: center; }

  .cim-bib-x { position: absolute; top: -5px; right: -5px; width: 19px; height: 19px; border-radius: 50%; border: none; background: rgba(var(--tinta-rgb),.55); color: #fff; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; }

// tamanho real da folha: se for "Personalizado", usa a largura/altura em cm que o usuário digitou
function cimTam(c) {
  const g = (c && c.config) || {};
  if (c && c.tamanho === 'custom') {
    const w = Math.max(50, Math.min(420, Number(g.cw) || 100)), h = Math.max(50, Math.min(594, Number(g.ch) || 210));
    return { n: 'Personalizado (' + (w / 10).toFixed(1).replace('.', ',') + ' × ' + (h / 10).toFixed(1).replace('.', ',') + ' cm)', w: w, h: h };
  }
  return CIM_TAMANHOS[c && c.tamanho] || CIM_TAMANHOS.dl;
}

function cimSemAst(t) { return String(t == null ? '' : t).replace(/\*/g, ''); }
// Negrito a pedido: o usuario poe *asteriscos* em volta das palavras que quer
// em negrito no titulo ou no subtitulo. O resto do texto continua igual.
function cimNeg(t) { return cimEsc(t).replace(/\*([^*\n]+)\*/g, '<b>$1</b>'); }
function cimEsc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function cimJuntar(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1]; }
function cimPontuar(s) { s = String(s).trim(); return /[.!?,;:]$/.test(s) ? s : s + '.'; }
function cimLogo(v) { return v === 'com' ? CIM_LOGO_COM : CIM_LOGO_SEM; }

function cimCfg(c) {

  const cfg = cimPreset(c && c.estilo === 'classico' ? 'friends' : 'creme');
  if (c && c.logo) cfg.logo = c.logo;
  return cfg;
}

// Reduz a imagem antes de guardar: logo de cliente costuma vir enorme e
// não precisa de mais do que isso para imprimir bem.
function cimEncolherImagem(arquivo, ladoMax, cb) {
  var leitor = new FileReader();
  leitor.onload = function () {
    var im = new Image();
    im.onload = function () {
      var w = im.width, h = im.height;
      var f = Math.min(1, ladoMax / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * f); cv.height = Math.round(h * f);
      var ct = cv.getContext('2d');
      ct.drawImage(im, 0, 0, cv.width, cv.height);
      try { cb(cv.toDataURL('image/png')); } catch (e) { cb(null); }
    };
    im.onerror = function () { cb(null); };
    im.src = leitor.result;
  };
  leitor.onerror = function () { cb(null); };
  leitor.readAsDataURL(arquivo);
}

function cimAddSec(nome) { _cim.secoes.push(nome && CIM_SECOES_PRONTAS[nome] ? Object.assign({}, CIM_SECOES_PRONTAS[nome]) : { titulo: '', modo: 'linhas', texto: '' }); cimRenderEditor(); }
function cimPreviaDebounce() { clearTimeout(_cimTimer); _cimTimer = setTimeout(cimPrevia, 250); }
function cimZoomMais(d) { _cimZoom = d === 0 ? 1 : Math.max(0.5, Math.min(2.2, _cimZoom + d)); cimPrevia(); }
// aviso de texto cortado na prévia — quem manda a mensagem é a folha, já com as fontes carregadas
function cimAvisoCorte(corta) {
  const box = document.getElementById('cim-prev-box'); if (!box) return;
  let av = document.getElementById('cim-aviso');
  if (!av) { av = document.createElement('div'); av.id = 'cim-aviso'; av.style.cssText = 'margin-top:8px;font-size:12.5px;color:#a33;font-weight:600'; box.parentNode.appendChild(av); }
  av.textContent = corta ? '⚠️ O texto não cabe nesta folha: parte vai sair cortada. Use um papel maior ou tire alguns pratos.' : '';
}
window.addEventListener('message', ev => {
  if (!ev.data || !ev.data.cim) return;
  if (ev.data.arrasto) { cimLogoArrastado(ev.data.arrasto.x, ev.data.arrasto.y); return; }
  cimAvisoCorte(!!ev.data.corta);
});
function cimPrevia() {
  const box = document.getElementById('cim-prev-box'); if (!box) return;
  const T = cimTam(_cim);
  const px = 3.7795, wpx = T.w * px, hpx = T.h * px, s = Math.min(1.4, 340 / wpx) * _cimZoom;
  let wrap = box.querySelector('.cim-prev-in');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'cim-prev-in'; box.appendChild(wrap); wrap.appendChild(document.createElement('iframe')); }
  wrap.style.width = (wpx * s) + 'px'; wrap.style.height = (hpx * s) + 'px';
  const fr = wrap.querySelector('iframe');
  fr.style.width = wpx + 'px'; fr.style.height = hpx + 'px'; fr.style.transform = 'scale(' + s + ')';
  fr.srcdoc = cimHtml(_cim, true);
  // a própria folha avisa quando o texto não coube (depois de carregar as fontes)
  cimAvisoCorte(null);
}

// ---------- salvar / duplicar / excluir / imprimir ----------
function cimLinhaBanco(c) {
  return { titulo: (c.titulo || '').trim(), tamanho: c.tamanho, secoes: c.secoes, config: c.config,
    estilo: c.config.modelo === 'friends' ? 'classico' : 'elegante', logo: c.config.logo };
}
async function cimSalvar() {
  const c = _cim;
  if (!c.titulo.trim()) { toast('Dê um título ao cardápio', true); return; }
  const row = Object.assign(cimLinhaBanco(c), { updated_at: new Date().toISOString() });
  showLoader(true);
  let res;
  if (c.id) res = await sb.from('cardapios_salao').update(row).eq('id', c.id).select();
  else res = await sb.from('cardapios_salao').insert(row).select();
  showLoader(false);
  if (res.error) { toast('Erro ao salvar: ' + res.error.message, true); return; }
  if (res.data && res.data[0]) c.id = res.data[0].id;
  toast('Cardápio guardado!');
  const r = await sb.from('cardapios_salao').select('*').order('updated_at', { ascending: false });
  _cimLista = r.data || _cimLista;
}
function cimVoltar() { _cim = null; renderImpressao(); }
async function cimDuplicar(id) {
  const c = _cimLista.find(x => x.id === id); if (!c) return;
  showLoader(true);
  const r = await sb.from('cardapios_salao').insert(Object.assign(cimLinhaBanco({ titulo: (c.titulo || '') + ' (cópia)', tamanho: c.tamanho || 'dl', secoes: c.secoes, config: cimCfg(c) })));
  if (!sbOk(r, 'duplicar o cardápio')) return;
  showLoader(false);
  toast('Cardápio duplicado'); renderImpressao();
}
async function cimExcluir(id) {
  const c = _cimLista.find(x => x.id === id); if (!c) return;
  if (!confirm('Apagar o cardápio "' + (c.titulo || '') + '"? Não dá para desfazer.')) return;
  showLoader(true);
  const r = await sb.from('cardapios_salao').delete().eq('id', id);
  if (!sbOk(r, 'apagar o cardápio')) return;
  showLoader(false);
  toast('Cardápio excluído'); renderImpressao();
}
function cimAbrirImpressao(c) {
  const html = cimHtml(c, false);
  const w = window.open('', '_blank');
  if (!w) { toast('Permita abrir uma nova aba para imprimir', true); return; }
  w.document.open(); w.document.write(html); w.document.close(); w.focus();
}
function cimImprimir() { cimAbrirImpressao(_cim); }
function cimImprimirSalvo(id) { const c = _cimLista.find(x => x.id === id); if (c) cimAbrirImpressao(c); }



window.addEventListener('load', function () { renderImpressao(); });
</script>
